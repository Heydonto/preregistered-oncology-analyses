# ---------------------------------------------------------------- cohorts & QC
tcga_pool:   # identical to armC post-QC spine
  rule: manifest status ok AND n_tiles >= 100 (4 slides excluded, same 4 as armC)
  slides: 1049
  patients: 956
  role: pretraining ONLY (development pool). Internal 90/10 patient split
    (stratified by cohort, random.Random(1234)) for early stopping only.

cptac_pool:
  slide_semantics:
    source: DICOM SeriesDescription per series (probe pre-hash, see above)
    observed: {HE tumor: 1343, HE normal: 743, ambiguous HE: 132}
    rule: >
      A slide enters the study iff manifest status == ok AND n_tiles >= 100
      AND series_desc == "HE tumor". Adjacent-normal slides (743) are excluded
      by design. Ambiguous "HE" slides (132) are excluded and logged; the 24
      patients whose slides are ALL ambiguous are excluded and listed
      individually in exclusions.json (reason: ambiguous_tissue_only).
      Fallback pre-registration: none needed — tumor/normal resolved for 94%
      of slides and 432/456 patients; the ambiguity is reported, not hidden.
  qc_exclusions:   # from pixels-side manifest, logged
    - {series_id: a6f6d9fe-2afc-476d-b1ad-05f1272b1f30, patient: C3N-04457, rule: status == empty_no_tissue}
    - {series_id: f32df5e3-e0c1-4529-afcb-74b19dafb0eb, patient: C3N-03762, rule: n_tiles < 100 (n_tiles=4; an HE-normal slide, excluded by tissue rule anyway)}
  post_qc: {slides: 1343, patients: 432, LUAD_patients: 229, LSCC_patients: 203}
  patient_bag: all post-QC tumor slides of a patient; patient-level prediction
    = mean of slide-level probabilities (risk scores for Cox), as in armC.

# ---------------------------------------------------------------- labels
labels:   # extraction rules pinned from schema only; CPTAC values unread at hash time
  subtype:
    source: manifest cohort column (pixels-side; LUAD=1, LSCC/LUSC=0)
    tcga_coding: {TCGA-LUAD: 1, TCGA-LUSC: 0}   # armC labels.csv column 'subtype'
    cptac_coding: {LUAD: 1, LSCC: 0}
    metric: patient-level AUROC
    role: positive control; zero-shot expected high
  egfr:
    tcga: armC labels.csv column 'egfr' (74 mut / 852 wt post-QC, published)
    cptac: >
      CPTAC-LUAD ONLY (no per-patient LSCC mutation file staged; LSCC patients
      excluded from this endpoint, logged). Same rule as armC:
      mutant = >=1 record in raw_mutations_cptac_luad.json with
      entrezGeneId == 1956, mutationType not in [Silent, silent,
      synonymous_variant], mutationStatus != Germline; wildtype = patient in
      clinical_extra_cptac_luad.csv with non-null MUTATION_COUNT and no
      qualifying record; otherwise unlabeled (excluded, logged).
    metric: patient-level AUROC
    label_shift: report measured EGFR prevalence TCGA (74/926) vs CPTAC-LUAD
      (post-unsealing) + the aggregate EGFR rows of prevalence_cptac_*.csv;
      the shift is expected from prior work and is reported, not "fixed".
    power_rule: report minimum-detectable AUROC from the permutation null; if
      eval-set mutants are thin, say so explicitly; never manufacture a positive
  os:
    tcga: armC labels.csv os_time/os_event
    cptac: clinical_extra_cptac_{luad,lscc}.csv OS_MONTHS / OS_STATUS, parsed
      exactly as armC ("0:LIVING"/"1:DECEASED"; exclude missing or time <= 0,
      logged)
    metric: Harrell C-index (patient-level mean risk)
    maturity_rule: >
      run the full k-shot grid iff >= 40 OS events among post-QC CPTAC
      patients; if 10-39 events, zero-shot only + power statement; if < 10
      events or columns empty, report absence honestly and drop with a power
      statement. Decision recorded in results.json BEFORE any Arm B CPTAC
      training run.

# ---------------------------------------------------------------- model
model: identical to armC (gated attention-MIL, Ilse et al. 2018)
  # projection 1024->512 ReLU dropout 0.25; gated attention hidden 256;
  # head linear 512->1; tile_cap 4096 deterministic subsample seeded by
  # sha1(slide_id) ^ seed; fp32 training. Verbatim reuse of armC build_model().

# ---------------------------------------------------------------- pretraining
pretraining:
  data: ALL post-QC TCGA (both cohorts; per-endpoint labeled subset)
  one_model_per_endpoint: true   # ONE pretrained checkpoint per endpoint,
    # shared by all 8 adaptation seeds (seed variance measures adaptation/eval
    # split noise, not pretraining noise)
  seed: 1234   # weights init, tile subsample, internal split
  optimizer: AdamW, lr 2.0e-4, weight_decay 1.0e-5, constant lr (armC)
  batch: 32 bags binary (BCE-with-logits), 64 bags Cox (Breslow, skip
    event-free batches)  # armC
  early_stopping: internal 90/10 patient split (stratified by cohort,
    random.Random(1234)); evaluate patient-level metric on the 10% each epoch;
    max 30 epochs, patience 5, restore best-val weights. Internal val used for
    early stopping ONLY — never reported as a result.

# ---------------------------------------------------------------- eval design
adaptation_design:
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  eval_set: per seed, a stratified (by cohort, random.Random(2000+seed)) draw
    of 40% of the 432 post-QC CPTAC patients (n=173, rounded per stratum) —
    FIXED per seed; every (k, method) and zero-shot at that seed is evaluated
    on exactly this set. Site-preserved by construction (TCGA != CPTAC).
  adaptation_pool: the other 60% (n=259 patients)
  k_grid: [10, 25, 50, 100]   # patients; NESTED per seed and endpoint —
    # per endpoint, order the adaptation-pool patients that carry that
    # endpoint's label by a stratified shuffle (random.Random(3000+seed);
    # strata: subtype -> cohort, egfr -> mutant status, os -> event status)
    # and take prefixes of length k. k=0 denotes zero-shot.
  methods:
    finetune: full fine-tune of the pretrained checkpoint, AdamW lr 2.0e-5
      (10x below pretraining), weight_decay 1.0e-5, 20 epochs, batch as in
      pretraining, final-epoch weights (no val peeking at adaptation time)
    linear_probe: freeze projection + attention; train head (512->1) only,
      AdamW lr 1.0e-3, weight_decay 0.0, 40 epochs, final-epoch weights
  zero_shot:
    - per seed: pretrained checkpoint evaluated on that seed's eval set (the
      k=0 point of every curve)
    - once: pretrained checkpoint evaluated on ALL 432 post-QC CPTAC patients
      (full-cohort zero-shot external validation, reported alongside)
  tile_subsample_seed: adaptation seed s (armC convention), for both
    adaptation training and eval prediction at that seed
  ci: mean +/- 1.96 * sd/sqrt(8) across the 8 seeds, per (endpoint, method, k)
  headline_question: smallest k whose seed-mean metric is within 0.02 of the
    same method's k=100 seed-mean (per endpoint x method), reported from
    learning_curve.csv

permutation_null:
  endpoint: egfr
  n_shuffles: 20
  procedure: >
    replicate r: EGFR labels of ALL labeled post-QC CPTAC-LUAD patients are
    shuffled once (random.Random(7000+r), consistent across adaptation/eval);
    the pretrained EGFR checkpoint is fine-tuned (method=finetune) on the
    seed-0 k=100 adaptation set against the shuffled labels and evaluated on
    the seed-0 eval set AGAINST THE SHUFFLED LABELS. Expect AUROC centered
    ~0.50 regardless of any real signal in the pretrained weights (labels are
    random w.r.t. any fixed scorer). The 95th percentile of the null is the
    minimum-detectable AUROC quoted in the power statement.

# ---------------------------------------------------------------- gates
gates:   # expected values pre-declared; failures retained, never deleted
  g1_no_silent_exclusions: {expect: every dropped slide/patient in
      exclusions.json with a reason (QC, non-tumor, ambiguous, unlabeled),
      kind: mechanical}
  g2_zeroshot_subtype: {expect: seed-mean zero-shot subtype AUROC >= 0.85 on
      the per-seed eval sets, kind: positive_control}
  g3_egfr_permutation_null: {expect: null mean AUROC in [0.45, 0.55],
      kind: null_control}
  g4_nan_degeneracy: {expect: no NaN loss in any retained run; eval prediction
      std > 1e-6 per run, kind: sanity}
  g5_grid_completes: {expect: 8 seeds x 4 k x 2 methods per active endpoint +
      zero-shot, all finish, kind: mechanical}
  g6_egfr_power_honesty: {expect: results.json carries the measured label
      shift + a minimum-detectable-AUROC statement keyed to eval-set mutant
      count, kind: honesty}
  g7_os_maturity_honesty: {expect: OS decision per labels.os.maturity_rule
      recorded before CPTAC training; absence reported with power statement if
      immature, kind: honesty}
  g8_subtype_monotone_trend: {expect: REPORTED (not gated) — Spearman rho of
      seed-mean subtype AUROC vs k (incl. k=0) per method, kind: descriptive}

# ---------------------------------------------------------------- evidence
evidence_bundle:
