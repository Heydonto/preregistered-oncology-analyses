# ---------------------------------------------------------------------------
# TRAPS IDENTIFIED IN THE RECON PACKAGE (documented here so they cannot be 'discovered' later)
# ---------------------------------------------------------------------------
traps_noted_in_advance:
  T1_dictionary_contamination: "Nine dictionary forms (B1, CA, D1, NP, OC, R1, RS, X1, XS) belong to RTOG-0214, not 6668. 'OC = derived outcomes' is the most dangerous: a convenient pre-cooked outcome table for the WRONG TRIAL. Declared out of scope above."
  T2_vital_status_code_9: "f1e2 == 9 is 'Dead, date of death unknown'. The naive event = (f1e2 == 2) undercounts deaths. Handled explicitly, with a mandatory sensitivity (S5)."
  T3_longitudinal_row_explosion: "F1 has 1541 rows for 243 patients; IM 465/246; Q2 591/244. Any row-level model silently weights patients by visit count. All forms are reduced to one row per cn by pre-declared rules."
  T4_ss_cutoff_forking: "SS has 1185 rows keyed by sse2 (SUV inclusion cutoff): about five analyses per patient and an invitation to cutoff shopping. Locked to the single minimum cutoff, and only as a fallback."
  T5_q2_qz_block_ambiguity: "Q2 and QZ are near-identical 154-column forms, each with 'SEMI QUANTITATIVE ASSESSMENT 1' and 'ASSESSMENT 2' SUV blocks and a 'Central read duplicate' inevaluable flag. Which block is the reported scan is NOT documented; resolved by an outcome-free structural test, or skipped."
  T6_immortal_time: "The exposure is measured 8-20 weeks after treatment. Measuring OS from registration would guarantee survival to the exposure and inflate any association. Hence the landmark origin t0 and gate G4b."
  T7_year_only_dates: "Raw date fields carry only YYYY. Only the '<form>e<N>d' day-offset fields are usable for intervals. Using the raw fields would produce silently wrong follow-up times."
  T8_f2_orphan_form: "F2 (62 rows) duplicates F1's 86-column schema. Ignoring it silently drops follow-up for those patients; it is stacked with F1 by rule."
  T9_registration_vs_followup_gap: "251 registrations, 243 patients with F1, 244 with Q2, 240 in the triple join, 242 patients with imaging on TCIA. Roughly 8-11 registered patients are not analysable; the exclusion ledger must absorb them rather than let the denominator drift."
  T10_ps_range_restriction: "Eligibility screened Zubrod performance status (A0 a0e37), so I1 i1e5 is probably restricted to 0-1. PC2 is therefore given an explicit UNINFORMATIVE-BY-RANGE branch instead of being allowed to 'fail'."
  T11_le_uniqueness_unverified: "LE (244 rows) is absent from joinable_counts_case_number_only, so its one-row-per-patient structure — on which the primary exposure depends — is an assumption and is gated (G2)."
  T12_no_suv_harmonisation: "PR codes 13 and 16 document post-treatment PET on a different or non-qualified scanner, and TA/QA record scanner make and reconstruction parameters. Absolute SUV comparability across sites is not established and is refused as a claim."
